name: daily-engine

on:
  schedule:
    # 22:20 UTC, Monday to Friday: after the US close in both summer and winter time
    - cron: "20 22 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-engine
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -r requirements.txt
      - name: Tests (no network)
        run: python -m tests.test_engine
      - name: Run the engine
        run: python -m engine.run_daily
      - name: Publish results
        run: |
          git config user.name "swing-engine"
          git config user.email "swing-engine@users.noreply.github.com"
          git add out universe/sp500.csv
          git diff --cached --quiet || git commit -m "engine: results for $(python -c "import json;print(json.load(open('out/latest.json'))['asof'])")"
          git push
