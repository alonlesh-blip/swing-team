name: research-data

# Manual, one-off: publishes a snapshot of the raw bars to a temporary branch so
# research can run offline. The branch is deleted after it has been downloaded.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "publish = push a fresh snapshot, delete = remove the temporary branch"
        default: publish
        type: choice
        options: [publish, delete]

permissions:
  contents: write

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Delete the temporary branch
        if: inputs.mode == 'delete'
        run: git push origin --delete research-data
      - uses: actions/setup-python@v5
        if: inputs.mode != 'delete'
        with:
          python-version: "3.12"
          cache: pip
      - if: inputs.mode != 'delete'
        run: pip install -r requirements.txt
      - if: inputs.mode != 'delete'
        run: python -m engine.dump_data bars.npz
      - name: Push snapshot to a temporary branch
        if: inputs.mode != 'delete'
        run: |
          mkdir pub && mv bars.npz pub/ && cd pub
          git init -q && git checkout -q -b research-data
          git add bars.npz
          git -c user.name="swing-engine" -c user.email="swing-engine@users.noreply.github.com" commit -q -m "research data snapshot"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" research-data
