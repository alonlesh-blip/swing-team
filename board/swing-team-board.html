<title>צוות הסווינג</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@700;900&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Hebrew:wght@400;500;600;700&display=swap">
<style>
/* Layout: a shift board. One line of seven stations (the team) runs across the top of the day;
   everything under it is what that line produced. Numbers are set in mono, verdicts in a serif headline. */
:root{
  --bg:#f3f6f7; --surface:#fcfcfb; --sunk:#eaeff1; --ink:#0e1b22; --ink2:#45545d; --muted:#75838b; --line:#dbe2e5;
  --accent:#0e5f73; --accent-soft:#deedf1; --accent-ink:#ffffff;
  --good:#0ca30c; --good-ink:#096b09; --good-soft:#e2f4e2;
  --bad:#d03b3b; --bad-ink:#a32626; --bad-soft:#fae6e6;
  --warn:#fab219; --warn-ink:#7d5200; --warn-soft:#fdf1d3;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --grid:#e1e0d9; --axis:#c3c2b7;
  --display:"Frank Ruhl Libre","Times New Roman",serif;
  --body:"IBM Plex Sans Hebrew","Segoe UI",Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0f1416; --surface:#1a1a19; --sunk:#232827; --ink:#f0efec; --ink2:#c3c8c5; --muted:#8d9793; --line:#2e3433;
  --accent:#58b6cc; --accent-soft:#1b3138; --accent-ink:#06191e;
  --good:#0ca30c; --good-ink:#5fd25f; --good-soft:#15301a;
  --bad:#e66767; --bad-ink:#f08b8b; --bad-soft:#3a1c1c;
  --warn:#fab219; --warn-ink:#fbc855; --warn-soft:#3a2f12;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --grid:#2c2c2a; --axis:#383835; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0f1416; --surface:#1a1a19; --sunk:#232827; --ink:#f0efec; --ink2:#c3c8c5; --muted:#8d9793; --line:#2e3433;
  --accent:#58b6cc; --accent-soft:#1b3138; --accent-ink:#06191e;
  --good:#0ca30c; --good-ink:#5fd25f; --good-soft:#15301a;
  --bad:#e66767; --bad-ink:#f08b8b; --bad-soft:#3a1c1c;
  --warn:#fab219; --warn-ink:#fbc855; --warn-soft:#3a2f12;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --grid:#2c2c2a; --axis:#383835; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:18px 56px;display:flex;flex-direction:column;gap:18px}
.n{font-family:var(--mono);font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate;display:inline-block}
td.n,th.n{display:table-cell;text-align:right}
h1,h2,h3,p{margin:0}
h2{font-size:17px;font-weight:700;text-wrap:balance}
h3{font-size:14px;font-weight:600}
.sub{color:var(--ink2);font-size:13.5px}
.mut{color:var(--muted);font-size:12.5px}
a{color:var(--accent)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* masthead */
.mast{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 24px}
.mast h1{font-family:var(--display);font-weight:900;font-size:30px;line-height:1.1;letter-spacing:.2px}
.mast .meta{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;color:var(--ink2);font-size:13px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 11px;font-weight:600;font-size:13px;border:1px solid transparent}
.pill i{width:9px;height:9px;display:inline-block}
.pill.green{background:var(--good-soft);color:var(--good-ink)} .pill.green i{background:var(--good);border-radius:50%}
.pill.yellow{background:var(--warn-soft);color:var(--warn-ink)} .pill.yellow i{background:var(--warn);transform:rotate(45deg)}
.pill.red{background:var(--bad-soft);color:var(--bad-ink)} .pill.red i{background:var(--bad)}
.pill.paper{background:var(--accent-soft);color:var(--accent)}
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);scrollbar-width:none}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:9px 13px;cursor:pointer;color:var(--ink2);font-weight:600;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.view{display:flex;flex-direction:column;gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.note{background:var(--sunk);border-radius:var(--r);padding:12px 14px;color:var(--ink2);font-size:13.5px}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:22px 16px;color:var(--ink2);text-align:center}
.warnbar{background:var(--warn-soft);color:var(--warn-ink);border-radius:var(--r);padding:10px 14px;font-size:13.5px;font-weight:500}

/* boss verdict */
.verdict{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:18px;align-items:start}
.verdict .who{font-size:12.5px;font-weight:600;color:var(--accent);letter-spacing:.3px}
.verdict .head{font-family:var(--display);font-weight:700;font-size:26px;line-height:1.2;text-wrap:balance;margin-block:2px 8px}
.orders{display:flex;flex-direction:column;gap:8px}
.order{border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;background:var(--bg)}
.order .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.order .tk{font-family:var(--mono);font-weight:600;font-size:16px}
.kv{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--ink2)}
.kv b{font-weight:600;color:var(--ink)}
.mkt{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;color:var(--ink2);border-top:1px solid var(--line);padding-top:10px;margin-top:12px}
.mkt b{color:var(--ink);font-weight:600}

/* the line of stations */
.line{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:0;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.st{background:none;border:0;border-inline-start:1px solid var(--line);padding:11px 10px 10px;text-align:start;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-width:0;position:relative}
.st:first-child{border-inline-start:0}
.st .role{font-weight:700;font-size:13.5px}
.st .job{font-size:11.5px;color:var(--muted);line-height:1.35}
.st .stat{font-size:13px;font-weight:600;margin-top:5px;color:var(--ink)}
.st[aria-pressed="true"]{background:var(--accent-soft)}
.st[aria-pressed="true"]::after{content:"";position:absolute;inset-inline:0;bottom:0;height:3px;background:var(--accent)}
.stbody{display:flex;flex-direction:column;gap:10px}
.items{display:flex;flex-direction:column;gap:0;border-top:1px solid var(--line)}
.item{display:grid;grid-template-columns:74px 92px minmax(0,1fr);gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13.5px;align-items:baseline}
.item .tk{font-family:var(--mono);font-weight:600}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:5px;padding:1px 7px;font-size:12px;font-weight:600;background:var(--sunk);color:var(--ink2);white-space:nowrap}
.chip.setup{background:var(--accent-soft);color:var(--accent)}
.chip.sus{background:var(--sunk);color:var(--muted);text-decoration:line-through;text-decoration-thickness:1px}
.chip.ok{background:var(--good-soft);color:var(--good-ink)} .chip.no{background:var(--bad-soft);color:var(--bad-ink)} .chip.hm{background:var(--warn-soft);color:var(--warn-ink)}
.src{font-size:12px;color:var(--muted);margin-top:2px}

/* scanner table */
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font-weight:600;color:var(--muted);font-size:11.5px;text-align:start;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface)}
td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
tr:last-child td{border-bottom:0}
tbody tr.row{cursor:pointer}
tbody tr.row:hover{background:var(--bg)}
tbody tr.row[aria-selected="true"]{background:var(--accent-soft)}
td.tk{font-family:var(--mono);font-weight:600;font-size:13.5px}
td .nm{display:block;font-family:var(--body);font-weight:400;color:var(--muted);font-size:11.5px;max-width:150px;overflow:hidden;text-overflow:ellipsis}
.score{display:flex;align-items:center;gap:7px}
.score .bar{width:54px;height:6px;background:var(--sunk);border-radius:3px;overflow:hidden;direction:ltr}
.score .bar span{display:block;height:100%;background:var(--accent)}
.cats{display:inline-grid;grid-template-columns:repeat(12,7px);gap:2px;direction:ltr;align-items:end;height:18px}
.cats span{background:var(--accent);opacity:.85;border-radius:1px 1px 0 0;min-height:2px}
.up{color:var(--good-ink)} .dn{color:var(--bad-ink)}
.sym{display:inline-block;width:16px;text-align:center;font-weight:700}
.more{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 14px;cursor:pointer;font-weight:600;font-size:13px;color:var(--accent)}
.legend-row{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:12px;color:var(--muted)}

/* ticker detail */
.detail{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:20px;align-items:start}
.dhead{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline}
.dhead .tk{font-family:var(--mono);font-size:22px;font-weight:600}
.grid300{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px 14px}
.grp .gh{display:flex;justify-content:space-between;font-size:12px;color:var(--ink2);margin-bottom:4px;font-weight:600}
.cells{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;direction:ltr}
.cell{aspect-ratio:1;border-radius:2px;border:0;padding:0;cursor:pointer;background:var(--good)}
.cell.f{background:transparent;box-shadow:inset 0 0 0 2px var(--bad)}
.cell.u{background:transparent;box-shadow:inset 0 0 0 1px var(--muted);opacity:.6}
.cell.on{outline:2px solid var(--ink);outline-offset:1px}
.probe{min-height:44px;background:var(--sunk);border-radius:8px;padding:9px 12px;font-size:13px}
.fails{columns:2;column-gap:20px;font-size:12.5px;color:var(--ink2);padding:0;margin:0;list-style:none}
.fails li{break-inside:avoid;padding:2px 0}
.fails .c{color:var(--muted);font-family:var(--mono);font-size:11px;margin-inline-end:5px}
details>summary{cursor:pointer;color:var(--accent);font-weight:600;font-size:13px}
.plan{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:8px}
.tile{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;display:flex;flex-direction:column;gap:1px;min-width:0}
.tile .l{font-size:11.5px;color:var(--muted)}
.tile .v{font-family:var(--mono);font-size:16px;font-weight:600;direction:ltr;text-align:end;unicode-bidi:isolate}
.tile .d{font-size:11.5px;color:var(--ink2)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.voices{display:flex;flex-direction:column;gap:8px}
.voice{border-inline-start:3px solid var(--line);padding-inline-start:10px;font-size:13.5px}
.voice .w{font-weight:700;font-size:12.5px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* charts */
.chart{direction:ltr;position:relative}
.chart svg{display:block;width:100%;height:auto}
.chart text{font-family:var(--mono);font-size:11px;fill:var(--muted)}
.chart .lbl{fill:var(--ink2)}
.legend{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:12.5px;color:var(--ink2);direction:rtl;margin-bottom:6px}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-inline-end:6px}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--surface);border-radius:6px;padding:6px 9px;font-size:12px;font-family:var(--mono);white-space:nowrap;z-index:3;top:4px}
.tip i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.crit{display:flex;flex-direction:column;gap:0;border-top:1px solid var(--line)}
.crit div{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13.5px;align-items:baseline}
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.rules ul,.rules ol{margin:6px 0 0;padding-inline-start:18px;font-size:13.5px;color:var(--ink2)}
.rules li{margin-bottom:3px}
.loglist{display:flex;flex-direction:column}
.logrow{display:grid;grid-template-columns:96px 84px minmax(0,1fr);gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13.5px;align-items:baseline}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width:860px){
  .verdict,.detail,.two{grid-template-columns:minmax(0,1fr)}
  .line{grid-template-columns:repeat(2,minmax(0,1fr))}
  .st{border-inline-start:0;border-top:1px solid var(--line)} .st:nth-child(-n+2){border-top:0} .st:nth-child(even){border-inline-start:1px solid var(--line)}
  .st:last-child{grid-column:1/-1}
  .mast h1{font-size:25px} .verdict .head{font-size:22px}
  .item{grid-template-columns:64px minmax(0,1fr)} .item .txt{grid-column:1/-1}
  .fails{columns:1}
  .logrow{grid-template-columns:86px minmax(0,1fr)} .logrow .txt{grid-column:1/-1}
}
@media (prefers-reduced-motion:no-preference){ .st,.row{transition:background .12s} }
</style>

<div class="wrap" dir="rtl" lang="he">
  <header class="mast">
    <div>
      <h1>צוות הסווינג</h1>
      <p class="sub">שישה תפקידים, 300 בודקים ובוס אחד. כיס של 10,000 דולר, כרגע על הנייר.</p>
    </div>
    <div class="meta" id="meta"><span class="pill paper">מסחר על הנייר בלבד</span></div>
  </header>
  <nav class="tabs" role="tablist" id="tabs">
    <button role="tab" data-tab="today" id="tab-today">היום</button>
    <button role="tab" data-tab="paper" id="tab-paper">תיק הנייר</button>
    <button role="tab" data-tab="evidence" id="tab-evidence">מה אומרת ההיסטוריה</button>
    <button role="tab" data-tab="log" id="tab-log">יומן החלטות</button>
    <button role="tab" data-tab="rules" id="tab-rules">ספר החוקים</button>
  </nav>
  <main id="view" class="view"><div class="empty">טוען את נתוני הצוות…</div></main>
  <footer class="mut">הלוח מציג מחקר ותרגול על הנייר. הוא לא ייעוץ השקעות ולא מבצע שום פעולה בכסף אמיתי.</footer>
</div>

<script>
(function(){
"use strict";
var S={all:false,tab:"today",latest:null,paper:null,bt:null,cat:null,runs:null,sel:null,station:"boss",probe:null,db:false,ready:false};
var $=function(id){return document.getElementById(id)};
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function num(x,d){if(x==null||isNaN(x))return"–";return Number(x).toLocaleString("en-US",{minimumFractionDigits:d==null?2:d,maximumFractionDigits:d==null?2:d})}
function n(x,d,suf){return'<span class="n">'+num(x,d)+(suf||"")+'</span>'}
function pct(x,d){if(x==null||isNaN(x))return'<span class="n">–</span>';var c=x>0?"up":x<0?"dn":"";return'<span class="n '+c+'">'+(x>0?"+":"")+num(x,d==null?1:d)+'%</span>'}
function usd(x,d){if(x==null||isNaN(x))return'<span class="n">–</span>';return'<span class="n">$'+num(x,d==null?0:d)+'</span>'}
function rr(x){if(x==null||isNaN(x))return'<span class="n">–</span>';var c=x>0?"up":x<0?"dn":"";return'<span class="n '+c+'">'+(x>0?"+":"")+num(x,2)+'R</span>'}
function dateHe(d){if(!d)return"–";var p=String(d).slice(0,10).split("-");return'<span class="n">'+Number(p[2])+"."+Number(p[1])+"."+p[0]+'</span>'}
function link(s){return s&&/^https:\/\//.test(s.url||"")?'<a href="'+esc(s.url)+'" target="_blank" rel="noopener">'+esc(s.title||"מקור")+'</a>':esc(s&&s.title||"")}
var REG={green:"משטר ירוק",yellow:"משטר צהוב",red:"משטר אדום"};
var STATIONS=[
 ["scanner","הסורק","פותח את היום בטבלה"],
 ["tagger","מתייג הסטאפים","מתאים סטאפ לפי החוקים"],
 ["news","קורא החדשות","דוחות, כותרות, אירועים"],
 ["money","עוקב הכסף הגדול","בעלי עניין, קרנות, נפח"],
 ["checkers","300 הבודקים","כל אחד בודק דבר אחד"],
 ["skeptic","המפקפק","מחפש למה זה ייכשל"],
 ["boss","הבוס","רוצה כן, כפוף לחוקים"]];
var VERD={ok:["ok","נקי"],caution:["hm","זהירות"],block:["no","פוסל"],support:["ok","מחזק"],neutral:["","ניטרלי"],against:["no","נגד"],veto:["no","וטו"],doubt:["hm","ספק"],pass:["ok","עובר"]};
function chipV(v){var x=VERD[v];return x?'<span class="chip '+x[0]+'">'+x[1]+'</span>':""}
function setupName(id){var c=S.cat&&S.cat.setups||[];for(var i=0;i<c.length;i++)if(c[i].id===id)return c[i].name;return id}
function watchName(id){return S.cat&&S.cat.watch&&S.cat.watch[id]||id}

/* ---------- chart ---------- */
function niceTicks(lo,hi,k){var span=hi-lo||1,step=Math.pow(10,Math.floor(Math.log10(span/k))),e=span/k/step;step*=e>=5?10:e>=2?5:e>=1?2:1;var t=[],v=Math.ceil(lo/step)*step;for(;v<=hi+1e-9;v+=step)t.push(v);return t}
function kfmt(v){return Math.abs(v)>=1000?"$"+(v/1000).toFixed(v%1000?1:0)+"K":"$"+v}
function lineChart(host,labels,series){
  var W=720,H=250,L=46,R=14,T=10,B=24,vals=[];
  series.forEach(function(s){s.values.forEach(function(v){if(v!=null)vals.push(v)})});
  if(vals.length<2){host.innerHTML='<div class="empty">הגרף יופיע אחרי שיצטברו לפחות שני ימי נתונים.</div>';return}
  var lo=Math.min.apply(null,vals),hi=Math.max.apply(null,vals),pad=(hi-lo)*0.08||50;lo-=pad;hi+=pad;
  var ticks=niceTicks(lo,hi,4),N=labels.length;
  var X=function(i){return L+(W-L-R)*(N>1?i/(N-1):0)},Y=function(v){return T+(H-T-B)*(1-(v-lo)/(hi-lo))};
  var g='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="גרף שווי לאורך זמן">';
  ticks.forEach(function(t){g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(t)+'" y2="'+Y(t)+'" stroke="var(--grid)" stroke-width="1"/><text x="'+(L-6)+'" y="'+(Y(t)+4)+'" text-anchor="end">'+kfmt(t)+'</text>'});
  var nx=Math.min(5,N),seen={};for(var k=0;k<nx;k++){var i=Math.round(k*(N-1)/Math.max(nx-1,1));if(seen[i])continue;seen[i]=1;g+='<text x="'+X(i)+'" y="'+(H-6)+'" text-anchor="'+(k===0?"start":k===nx-1?"end":"middle")+'">'+esc(String(labels[i]).slice(2))+'</text>'}
  series.forEach(function(s){var d="",pen=false,last=null;s.values.forEach(function(v,i){if(v==null){pen=false;return}d+=(pen?"L":"M")+X(i).toFixed(1)+" "+Y(v).toFixed(1);pen=true;last=i});
    g+='<path d="'+d+'" fill="none" stroke="var('+s.color+')" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
    if(last!=null)g+='<circle cx="'+X(last)+'" cy="'+Y(s.values[last])+'" r="4" fill="var('+s.color+')" stroke="var(--surface)" stroke-width="2"/>'});

  v.innerHTML=({today:viewToday,paper:viewPaper,evidence:viewEvidence,log:viewLog,rules:viewRules}[S.tab]||viewToday)();
  if(S.tab==="paper"&&S.paper&&$("ch-paper")){var c=S.paper.curve||[];lineChart($("ch-paper"),c.map(function(x){return x.d}),[{name:"תיק הנייר",short:"Paper",color:"--s1",values:c.map(function(x){return x.eq})},{name:"SPY",short:"SPY",color:"--s2",values:c.map(function(x){return x.spy})}])}
  if(S.tab==="evidence"&&S.bt&&$("ch-bt")){var b=S.bt.curve||[];lineChart($("ch-bt"),b.map(function(x){return x.d}),[{name:"התיק לפי החוקים",short:"Rules",color:"--s1",values:b.map(function(x){return x.eq})},{name:"SPY",short:"SPY",color:"--s2",values:b.map(function(x){return x.spy})},{name:"היקום, משקל שווה",short:"Univ",color:"--s3",values:b.map(function(x){return x.ew})}])}
}
document.addEventListener("click",function(e){
  var t=e.target.closest("#tabs button");if(t){S.tab=t.dataset.tab;try{history.replaceState(null,"","#"+S.tab)}catch(_){}render();return}
  if(e.target.closest("#more")){S.all=!S.all;render();return}
  var st=e.target.closest(".st");if(st){S.station=st.dataset.st;render();return}
  var cell=e.target.closest(".cell");if(cell){S.probe=Number(cell.dataset.i);var d=$("detail");if(d)d.innerHTML=detail();return}
  var row=e.target.closest("tr.row");if(row){S.sel=row.dataset.t;S.probe=null;document.querySelectorAll("tr.row").forEach(function(r){r.setAttribute("aria-selected",r.dataset.t===S.sel)});var dd=$("detail");if(dd){dd.innerHTML=detail();dd.scrollIntoView({block:"nearest",behavior:"smooth"})}}
});
document.addEventListener("keydown",function(e){if(e.key==="Enter"&&e.target.matches&&e.target.matches("tr.row"))e.target.click()});
var h0=(location.hash||"").replace("#","");if({today:1,paper:1,evidence:1,log:1,rules:1}[h0])S.tab=h0;
render();
function start(db){
  S.ready=true;S.db=!!db;render();if(!db)return;
  var sub=function(path,key){db.doc(path).onSnapshot(function(s){S[key]=s.exists?s.data():null;render()},function(){})};
  sub("team/latest","latest");sub("paper/state","paper");sub("engine/backtest","bt");sub("engine/catalog","cat");
  db.collection("runs").orderBy("date","desc").limit(60).onSnapshot(function(q){S.runs=q.docs.map(function(d){return d.data()});if(S.tab==="log")render()},function(){});
}
if(window.claude&&window.claude.use)window.claude.use("db").then(start,function(){start(null)});else start(null);
})();
</script>
